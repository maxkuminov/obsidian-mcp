# obsidian-mcp server. The constraints below are properties of the
# application. They are not style choices, and each one is explained in
# docs/deployment-kubernetes.md.
#
#   * replicas: 1 + strategy Recreate. Every /mcp rate limit, the failed-auth
#     budget, concurrency admission and the vault-root overlap snapshot live
#     in the process's memory. A second pod, or a RollingUpdate surge that
#     briefly runs two, multiplies every limit and races two indexers over
#     the same vault. Do not add an HPA.
#   * The image's CMD runs `uvicorn --workers 1 --no-proxy-headers`. It is not
#     overridden here. If you ever override `command`/`args`, keep both flags.
#     --workers 1 is the same single-process contract as above, and
#     --no-proxy-headers leaves TRUSTED_PROXY_IPS as the only forwarded-header
#     control. Never set FORWARDED_ALLOW_IPS.
#   * No fsGroup (see pvc-vault.yaml). The pod runs as the uid that owns the
#     vault files. 1000 is the image's own user. Change runAsUser/runAsGroup
#     in your overlay if your vault is owned by another uid.
#   * seccomp RuntimeDefault. The server needs openat2(2) (kernel >= 5.6) and
#     exits at startup if the runtime's seccomp profile blocks it. The
#     containerd/CRI-O default profiles allow it.
#   * readOnlyRootFilesystem. The server writes only to the vault and /tmp
#     (python-multipart spools large form bodies there), so /tmp is an
#     emptyDir.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: obsidian-mcp
  labels:
    app.kubernetes.io/name: obsidian-mcp
    app.kubernetes.io/component: server
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: obsidian-mcp
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: obsidian-mcp
        app.kubernetes.io/component: server
    spec:
      automountServiceAccountToken: false
      # Service links inject variables such as POSTGRES_PORT=tcp://… for every
      # Service in the namespace. The app reads its settings from the
      # environment and checks it at startup (PGSSL* is refused, PGHOST and
      # friends are refused under strict TLS modes), so keep the environment
      # to exactly what is declared here.
      enableServiceLinks: false
      # Long enough for an in-flight index transaction and open MCP streams
      # to finish after SIGTERM.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # fsGroup deliberately absent. See the header comment.
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Schema migrations, before the server starts. Recreate + one replica
        # means only one pod ever runs this at a time. Take a database backup
        # before an upgrade that carries a migration: see "Upgrades and
        # migrations" in the guide, and components/db-backup.
        - name: migrate
          image: obsidian-mcp
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: obsidian-mcp-config
            - secretRef:
                name: obsidian-mcp-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: obsidian-mcp
          image: obsidian-mcp
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: obsidian-mcp-config
            - secretRef:
                name: obsidian-mcp-secrets
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          # The Host header is load-bearing. The app rejects any Host outside
          # ALLOWED_HOSTS (derived: MCP_HOSTNAME + localhost) with 400, and the
          # kubelet sends the pod IP by default, so a probe without this header
          # can never pass.
          startupProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 5
            timeoutSeconds: 5
            # Up to 5 minutes: startup runs database checks and publishes the
            # vault-root snapshot before it serves.
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            # Reference deployment: ~400 MiB peak for a few-thousand-note
            # vault. Embedding with a remote provider costs little memory.
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: vault
              mountPath: /obsidian
            - name: tmp
              mountPath: /tmp
          # Multi-user mode: mount each additional user's vault as its own
          # volume at /vaults/<name>, then assign that path to the user in the
          # panel. Never mount one vault inside another vault's path.
          # - name: vault-alice
          #   mountPath: /vaults/alice
      volumes:
        - name: vault
          persistentVolumeClaim:
            claimName: obsidian-mcp-vault
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      # - name: vault-alice
      #   persistentVolumeClaim:
      #     claimName: obsidian-mcp-vault-alice
