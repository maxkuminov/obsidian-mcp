# EXAMPLE ONLY. It is deliberately not listed in kustomization.yaml.
#
# Create the real Secret from the command line (it stays out of git):
#
#   kubectl -n obsidian-mcp create secret generic obsidian-mcp-secrets \
#     --from-literal=DATABASE_URL='postgresql+asyncpg://obsidian_mcp:<password>@postgres:5432/obsidian_mcp' \
#     --from-literal=SECRET_KEY="$(openssl rand -hex 32)" \
#     --from-literal=OPENAI_API_KEY='sk-...'
#
# Or copy this file outside the repo, fill it in, and apply it. You can also
# use your usual secret tooling (SOPS, External Secrets, Sealed Secrets).
#
# DATABASE_URL:
#   * The driver must be `postgresql+asyncpg://`.
#   * URL-encode any reserved character in the password (@ : / ? # %).
#   * No TLS parameters (?ssl=, ?sslmode=). They are refused at startup. TLS
#     is DATABASE_SSL_MODE in the ConfigMap.
#   * With the bundled postgres/ component, the host is `postgres` and the
#     password is the `app-password` key of the `obsidian-mcp-postgres`
#     Secret.
# SECRET_KEY: signs session cookies and CSRF tokens. The app refuses to start
#   on a placeholder (CHANGE_ME, changeme, empty).
# OPENAI_API_KEY: required when EMBEDDING_PROVIDER=openai. Leave the key out
#   for Ollama.
apiVersion: v1
kind: Secret
metadata:
  name: obsidian-mcp-secrets
  namespace: obsidian-mcp
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://obsidian_mcp:CHANGE_ME@postgres:5432/obsidian_mcp
  SECRET_KEY: CHANGE_ME
  OPENAI_API_KEY: CHANGE_ME
