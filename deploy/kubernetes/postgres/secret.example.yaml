# EXAMPLE ONLY. It is not listed in kustomization.yaml.
#
#   kubectl -n obsidian-mcp create secret generic obsidian-mcp-postgres \
#     --from-literal=superuser-password="$(openssl rand -hex 24)" \
#     --from-literal=app-password="$(openssl rand -hex 24)"
#
# The init script reads both on the FIRST start only, against an empty data
# directory. Changing them later changes nothing in the database. Use ALTER
# ROLE for that, then update DATABASE_URL in `obsidian-mcp-secrets`, whose
# password must equal `app-password` (hex passwords need no URL-encoding).
apiVersion: v1
kind: Secret
metadata:
  name: obsidian-mcp-postgres
  namespace: obsidian-mcp
type: Opaque
stringData:
  superuser-password: CHANGE_ME
  app-password: CHANGE_ME
