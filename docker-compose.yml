# Reference deployment for a Traefik-fronted homelab setup.
#
# To adapt to your environment, set in `.env`:
#   MCP_HOSTNAME       -- public hostname Traefik routes to
#   VAULT_HOST_PATH    -- host path to your Obsidian vault
#
# Backups are written host-side by `make db-backup` into $(DATA_DIR)/backups
# and are deliberately NOT mounted into the container (see
# docs/architecture/control-panel.md, "Backup recency"); `make deploy`
# refuses a container that has a mount at /app/backups.
#
# The Traefik labels assume an external `t2_proxy` network and a
# `chain-oauth@file` middleware; adjust the network/middleware names
# (or strip them) for your reverse-proxy setup.

networks:
  t2_proxy:
    external: true

services:
  obsidian-mcp:
    image: localhost:5000/obsidian-mcp:latest
    pull_policy: always
    container_name: obsidian-mcp
    restart: unless-stopped
    hostname: obsidian-mcp
    networks:
      - t2_proxy
    security_opt:
      - no-new-privileges:true
      - apparmor=docker-default
    cap_drop:
      - ALL
    # memory cap: applied LIVE on 2026-07-07 (docker update) but never written
    # here, so any recreate silently dropped it -- persisted 2026-07-27.
    # Peak 378M/2G = 18%, ample headroom.
    mem_limit: 2g
    memswap_limit: 2g
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 512M
    env_file:
      - .env
    volumes:
      # Max (admin) — bootstraps to vault_path=/obsidian after the flag flip.
      - ${VAULT_HOST_PATH:-./vault}:/obsidian
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

      # Multi-user mode (MULTI_USER_MODE=true): mount each user's host
      # directory under /vaults/<username>. Quote any host path that
      # contains spaces. Admin assigns the container path on the user
      # record via /admin/users/<id>/edit.

      # Second user — assign vault_path=/vaults/oksana in the panel after the
      # user is created. The host path lives in .env (this file is public).
      - "${OKSANA_VAULT_HOST_PATH:-./vaults/oksana}:/vaults/oksana"

      # Additional users — add an entry per user as you invite them.
      # Example: "/storage/vaults/alice:/vaults/alice"
    labels:
      - "traefik.enable=true"
      # Panel + authorize router (OAuth protected)
      - "traefik.http.routers.obsidian-mcp-panel-rtr.entrypoints=https"
      - "traefik.http.routers.obsidian-mcp-panel-rtr.rule=Host(`${MCP_HOSTNAME:-obsidian-mcp.localhost}`) && (PathPrefix(`/admin`) || Path(`/authorize`))"
      - "traefik.http.routers.obsidian-mcp-panel-rtr.tls=true"
      - "traefik.http.routers.obsidian-mcp-panel-rtr.tls.certresolver=dns-namecheap"
      - "traefik.http.routers.obsidian-mcp-panel-rtr.middlewares=chain-oauth@file"
      - "traefik.http.routers.obsidian-mcp-panel-rtr.service=obsidian-mcp-svc"
      # API/MCP/OAuth public router (no OAuth — app-level auth)
      #
      # NO `ratelimit` middleware here, deliberately (#194). A Traefik
      # ratelimit was considered and rejected for three reasons. (1) A proxy
      # cannot condition on the RESPONSE STATUS, so bounding unauthenticated
      # probing at this layer would mean throttling authenticated agents too;
      # the failed-authentication budget lives in `APIKeyMiddleware` instead,
      # where it can count only the 401s. (2) This one router also serves
      # /transfer, /health and /.well-known, so any label here would throttle
      # all four surfaces together. (3) The host's Traefik STATIC config lives
      # outside this repo (see CLAUDE.md, "Public repo — host paths live
      # outside the tree"), so a control expressed there would not be
      # reproducible from the tree. The per-principal token buckets and the
      # per-address auth budget are in-process — see
      # docs/architecture/rate-limits.md, and note that `--workers 1` in the
      # Dockerfile is load-bearing for them.
      - "traefik.http.routers.obsidian-mcp-api-rtr.entrypoints=https"
      - "traefik.http.routers.obsidian-mcp-api-rtr.rule=Host(`${MCP_HOSTNAME:-obsidian-mcp.localhost}`) && (PathPrefix(`/mcp`) || PathPrefix(`/transfer`) || Path(`/health`) || PathPrefix(`/.well-known`) || Path(`/register`) || Path(`/token`) || Path(`/revoke`))"
      - "traefik.http.routers.obsidian-mcp-api-rtr.tls=true"
      - "traefik.http.routers.obsidian-mcp-api-rtr.tls.certresolver=dns-namecheap"
      - "traefik.http.routers.obsidian-mcp-api-rtr.service=obsidian-mcp-svc"
      # REST API router (OAuth protected)
      - "traefik.http.routers.obsidian-mcp-apirest-rtr.entrypoints=https"
      - "traefik.http.routers.obsidian-mcp-apirest-rtr.rule=Host(`${MCP_HOSTNAME:-obsidian-mcp.localhost}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.obsidian-mcp-apirest-rtr.tls=true"
      - "traefik.http.routers.obsidian-mcp-apirest-rtr.tls.certresolver=dns-namecheap"
      - "traefik.http.routers.obsidian-mcp-apirest-rtr.middlewares=chain-oauth@file"
      - "traefik.http.routers.obsidian-mcp-apirest-rtr.service=obsidian-mcp-svc"
      # Root MCP router — bypass OAuth for a bare `/` carrying a Bearer token
      # (clients like OpenWebUI strip the /mcp prefix; RootMCPProxyMiddleware
      # rewrites exactly `/` → `/mcp/` and nothing else). The `Path(`/`)` scope
      # is load-bearing security, not tidiness: without it this rule's
      # priority=100 outranks the OAuth-protected panel/api routers (whose
      # default priority is their rule length, ~52–78) for EVERY path, so any
      # request to `/admin/*` or `/api/*` carrying any `Authorization: Bearer`
      # header would reach the app with the `chain-oauth@file` middleware
      # bypassed. Keep the path scope on any future header-matched root rule.
      - "traefik.http.routers.obsidian-mcp-root-rtr.entrypoints=https"
      - "traefik.http.routers.obsidian-mcp-root-rtr.rule=Host(`${MCP_HOSTNAME:-obsidian-mcp.localhost}`) && Path(`/`) && HeaderRegexp(`Authorization`, `^Bearer `)"
      - "traefik.http.routers.obsidian-mcp-root-rtr.tls=true"
      - "traefik.http.routers.obsidian-mcp-root-rtr.tls.certresolver=dns-namecheap"
      - "traefik.http.routers.obsidian-mcp-root-rtr.priority=100"
      - "traefik.http.routers.obsidian-mcp-root-rtr.service=obsidian-mcp-svc"
      # Shared service
      - "traefik.http.services.obsidian-mcp-svc.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
