# Self-contained deployment: Postgres + MCP server + Caddy (TLS).
#
# Use this if you don't already run Postgres / Traefik / etc. The full
# `docker-compose.yml` is the maintainer's homelab reference and assumes
# an external Traefik with OAuth chain — adapt to taste.
#
# Configuration (or run `make init`, which generates both passwords):
#   - copy `.env.example` to `.env`; set MCP_HOSTNAME, OPENAI_API_KEY,
#     SECRET_KEY, VAULT_HOST_PATH and OBSIDIAN_DB_PASSWORD (the application
#     role's password; this file builds DATABASE_URL from it);
#   - copy `postgres.env.example` to `postgres.env` (chmod 600) and set
#     POSTGRES_PASSWORD, the database SUPERUSER password. Only the postgres
#     service reads that file; the app never sees it.
# Upgrading an install created before #324: DEPLOYMENT.md, "Upgrading: split
# database roles". Then:
#
#   docker compose -f docker-compose.simple.yml up -d
#
# Caddy will auto-issue Let's Encrypt certs from MCP_HOSTNAME.

services:
  # Two database identities (#324): the bootstrap SUPERUSER `postgres`, whose
  # password lives in postgres.env and is loaded by this service only, and the
  # application's NON-superuser role `obsidian_mcp`, created by
  # docker/db-init-compose.sh on the first start of an empty volume with
  # OBSIDIAN_DB_PASSWORD from .env. The entrypoint wrapper validates both
  # passwords before the image's own entrypoint (and so before initdb) runs.
  # Keep this service identical in docker-compose.simple.yml and
  # docker-compose.proxy.yml (tests/test_compose_db_roles.py enforces it).
  postgres:
    image: pgvector/pgvector:pg16
    container_name: obsidian-mcp-postgres
    restart: unless-stopped
    entrypoint: ["bash", "/usr/local/bin/obsidian-mcp-postgres-entrypoint.sh"]
    command: ["postgres"]
    env_file:
      - postgres.env
    environment:
      POSTGRES_USER: postgres
      OBSIDIAN_DB_PASSWORD: ${OBSIDIAN_DB_PASSWORD:?set OBSIDIAN_DB_PASSWORD in .env (openssl rand -hex 32), see DEPLOYMENT.md}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres-entrypoint.sh:/usr/local/bin/obsidian-mcp-postgres-entrypoint.sh:ro
      - ./docker/db-init-compose.sh:/docker-entrypoint-initdb.d/10-obsidian-mcp.sh:ro
    healthcheck:
      # Over TCP on purpose: during first-start initialisation the image's
      # temporary server listens on the Unix socket only, so a socket probe
      # could report healthy before the application role exists.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U obsidian_mcp -d obsidian_mcp"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - mcp_internal

  obsidian-mcp:
    build: .
    image: obsidian-mcp:local
    container_name: obsidian-mcp
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    # Set here, so they override anything in .env (environment beats env_file):
    # DATABASE_URL is built from the one statement of the runtime password, and
    # POSTGRES_PASSWORD is blanked so a superuser password left in .env by the
    # pre-#324 instructions never reaches this container.
    environment:
      DATABASE_URL: postgresql+asyncpg://obsidian_mcp:${OBSIDIAN_DB_PASSWORD:?set OBSIDIAN_DB_PASSWORD in .env (openssl rand -hex 32), see DEPLOYMENT.md}@postgres:5432/obsidian_mcp
      POSTGRES_PASSWORD: ""
    volumes:
      - ${VAULT_HOST_PATH:-./vault}:/obsidian
    networks:
      - mcp_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # This override replaces the image CMD, so it must carry the CMD's flags.
    # --no-proxy-headers: TRUSTED_PROXY_IPS is the single statement of which
    # peers may set X-Forwarded-* (see the Dockerfile). uvicorn's own layer
    # defaults to *enabled* and reads $FORWARDED_ALLOW_IPS, so leaving it on
    # would rewrite the client address before the app's middleware runs and the
    # narrowed setting could not undo it. --workers 1 is load-bearing: every
    # rate control is in-process worker memory.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn src.main:app --host 0.0.0.0 --port 8000 --workers 1 --no-proxy-headers"

  caddy:
    image: caddy:2
    container_name: obsidian-mcp-caddy
    restart: unless-stopped
    depends_on:
      - obsidian-mcp
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      MCP_HOSTNAME: ${MCP_HOSTNAME:-obsidian-mcp.localhost}
    volumes:
      - ./Caddyfile.example:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - mcp_internal

networks:
  mcp_internal:
    driver: bridge

volumes:
  pg_data:
  caddy_data:
  caddy_config:
