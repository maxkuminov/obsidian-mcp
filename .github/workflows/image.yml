# Build -> Trivy gate -> push a PRIVATE image to GHCR (ghcr.io/maxkuminov/obsidian-mcp).
#
# A k3s deployment runs this image pinned BY DIGEST in a separate GitOps repo; a
# push here changes nothing anywhere until that digest is bumped there. The
# `make deploy` path (build locally, push to the REGISTRY in Makefile.local) is
# independent of this workflow and unchanged by it.
#
# Test gating: this workflow does NOT re-run the test suite. It is triggered by
# the CI workflow (ci.yml) completing, and only pushes when that CI run was a
# SUCCESS for a PUSH to main in THIS repository. CI is the one place that knows
# how to run the suite (pgvector service, unprivileged-userns relaxation, the
# junit gate on the namespace harness, schema-gate, openspec, trivy), so the
# image is built from exactly the commit CI has already proven, with no second
# copy of that setup to drift.
#
#   workflow_run      CI succeeded on a push to main -> build, scan, push
#                     (skipped when no image input changed: see the
#                     "Image-relevant change?" step), plus the Flux tag.
#   workflow_dispatch manual re-push of main; refuses unless CI succeeded for
#                     that exact commit on a push to main.
#   pull_request      only when this file changes: build + scan, never push,
#                     so a change to the workflow is exercised before merge.
#
# Two jobs, so a pull_request run never holds a writable GHCR token: a
# same-repository PR gets whatever permissions its job declares, and a step
# that only skips the push does not remove the credential. `build-scan` is
# read-only and runs for pull_request only; `publish` holds packages: write
# and runs only on the validated workflow_run and main-only workflow_dispatch
# paths.
name: image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/image.yml

permissions: {}

concurrency:
  # Pushes to main are serialized (never cancelled mid-push); PR runs of this
  # file supersede each other.
  group: image-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/maxkuminov/obsidian-mcp
  # Trivy runs from its container image pinned by digest (not trivy-action):
  # 0.69.3, the same pin as the other GHCR image workflows.
  TRIVY_IMAGE: aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c

jobs:
  build-scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: |
          set -euo pipefail
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.licenses=MIT" \
            -t obsidian-mcp:ci .

      # Same flags as `make trivy`: HIGH,CRITICAL with an available fix fails
      # the job, vuln scanner only. .trivyignore is honoured when present.
      - name: Trivy scan (HIGH/CRITICAL, ignore-unfixed)
        run: |
          set -euo pipefail
          ignore=()
          if [ -f .trivyignore ]; then ignore=(--ignorefile /src/.trivyignore); fi
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -v "$PWD:/src:ro" \
            "$TRIVY_IMAGE" image \
              --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed \
              --no-progress --scanners vuln \
              "${ignore[@]}" \
              obsidian-mcp:ci

      - name: Summary (not pushed)
        run: |
          {
            echo "### obsidian-mcp image"
            echo
            echo "Built and scanned \`${GITHUB_SHA}\` — **not pushed** (pull_request)."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    # workflow_run fires for EVERY completed CI run, including pull_request
    # runs from forks whose head branch may also be called "main". Only a
    # successful CI run for a push event in this repository may lead to a
    # push; workflow_dispatch only from main (re-checked against CI below).
    if: >-
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      ) || (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read   # workflow_dispatch: look up the CI result for the commit
    steps:
      - name: Resolve commit
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            workflow_run)
              sha="$RUN_SHA" ;;
            workflow_dispatch)
              if [ "$REF" != "refs/heads/main" ]; then
                echo "::error::workflow_dispatch pushes main only (got $REF)"; exit 1
              fi
              sha="$GITHUB_SHA"
              # Same gate as the workflow_run path: CI must have succeeded for
              # this exact commit on a push to main.
              ok=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml \
                     --commit "$sha" --event push --branch main \
                     --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
              if [ "${ok:-0}" -lt 1 ]; then
                echo "::error::no successful CI run on push to main for ${sha} — refusing to push"; exit 1
              fi ;;
            *)
              echo "::error::unexpected event $EVENT"; exit 1 ;;
          esac
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad sha '$sha'"; exit 1; }
          {
            echo "BUILD_SHA=$sha"
            echo "SHORT_SHA=${sha::7}"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.BUILD_SHA }}
          persist-credentials: false
          fetch-depth: 0   # the change check below diffs against an older commit

      # Docs-only merges must not rebuild: a new image restarts the pod, and
      # every pod start takes a pre-migrate pg_dump. `on.workflow_run` has no
      # `paths` filter (it fires on every CI completion), so the filter is this
      # step. The base is the commit the currently published `main` image was
      # built from (its org.opencontainers.image.revision label), not the
      # previous main commit, so a skipped docs merge followed by a code merge,
      # a multi-commit push, or a build that failed last time are all covered.
      # Anything it cannot establish (no label, unreadable registry, base not an
      # ancestor, same commit = re-run, workflow_dispatch) means BUILD.
      # Image inputs = what the Dockerfile COPYs, plus the Dockerfile, the scan
      # config and this workflow; requirements*.txt and docker/ are included
      # deliberately broad. docs/, openspec/, tests/ and *.md are not inputs.
      - name: Image-relevant change?
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          relevant='^(src/|alembic/|scripts/|docker/)|^(alembic\.ini|Dockerfile|\.dockerignore|\.trivyignore|requirements[^/]*\.txt|\.github/workflows/image\.yml)$'
          build=true
          reason="workflow_dispatch always builds"
          if [ "$EVENT" = workflow_run ]; then
            base=""
            if echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin >/dev/null 2>&1; then
              base=$(docker buildx imagetools inspect "${IMAGE}:main" \
                       --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}' 2>/dev/null || true)
              docker logout ghcr.io >/dev/null 2>&1 || true
            fi
            if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]]; then
              reason="no readable revision on ${IMAGE}:main"
            elif [ "$base" = "$BUILD_SHA" ]; then
              reason="${IMAGE}:main is already ${BUILD_SHA} (re-run)"
            elif ! git merge-base --is-ancestor "$base" "$BUILD_SHA" 2>/dev/null; then
              reason="published revision ${base} is not an ancestor of ${BUILD_SHA}"
            else
              changed=$(git diff --name-only "$base" "$BUILD_SHA")
              hits=$(grep -E "$relevant" <<<"$changed" || true)
              if [ -n "$hits" ]; then
                reason="image inputs changed since ${base}: $(tr '\n' ' ' <<<"$hits")"
              else
                build=false
                reason="no image input changed since ${base}"
              fi
            fi
          fi
          echo "$reason"
          echo "IMAGE_RELEVANT=${build}" >> "$GITHUB_ENV"
          if [ "$build" = false ]; then
            {
              echo "### obsidian-mcp image"
              echo
              echo "\`${BUILD_SHA}\` **not built or pushed**: ${reason}."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build
        if: env.IMAGE_RELEVANT == 'true'
        run: |
          set -euo pipefail
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${BUILD_SHA}" \
            --label "org.opencontainers.image.licenses=MIT" \
            -t obsidian-mcp:ci .

      # Same flags as `make trivy`: HIGH,CRITICAL with an available fix fails
      # the job, vuln scanner only. .trivyignore is honoured when present.
      - name: Trivy scan (HIGH/CRITICAL, ignore-unfixed)
        if: env.IMAGE_RELEVANT == 'true'
        run: |
          set -euo pipefail
          ignore=()
          if [ -f .trivyignore ]; then ignore=(--ignorefile /src/.trivyignore); fi
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -v "$PWD:/src:ro" \
            "$TRIVY_IMAGE" image \
              --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed \
              --no-progress --scanners vuln \
              "${ignore[@]}" \
              obsidian-mcp:ci

      - name: Push to GHCR
        if: env.IMAGE_RELEVANT == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          for tag in "sha-${SHORT_SHA}" main; do
            docker tag obsidian-mcp:ci "${IMAGE}:${tag}"
            docker push "${IMAGE}:${tag}"
          done
          digest=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "${IMAGE}:sha-${SHORT_SHA}" \
                   | grep -m1 "^${IMAGE}@sha256:" | cut -d@ -f2)
          test -n "$digest"
          {
            echo "### obsidian-mcp image"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${BUILD_SHA}\` |"
            echo "| tags | \`sha-${SHORT_SHA}\`, \`main\` |"
            echo "| digest | \`${digest}\` |"
            echo
            echo "Kustomize pin:"
            echo
            echo '```yaml'
            echo "images:"
            echo "  - name: ${IMAGE}"
            echo "    newTag: sha-${SHORT_SHA}"
            echo "    digest: ${digest}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          docker logout ghcr.io

      # Flux image automation (maxkuminov/infra docs/homelab-image-automation.md,
      # D1): an immutable, sortable main-<shortsha>-<run_number> tag next to
      # the tags above. <run_number> is the TRIGGERING CI run's number
      # (github.event.workflow_run.run_number), not this workflow's: GitHub
      # assigns it when the push starts CI, so a later push always gets a
      # higher one, and a re-run of CI or of this workflow keeps it. This
      # workflow's own github.run_number would NOT do: it is assigned when CI
      # completes, and CI runs for two pushes can complete out of order.
      # Ordering by the CI number means an older commit's tag - even one
      # published late - can never outrank a newer commit's, so there is
      # deliberately NO "still the main tip" check. A tip check only added a
      # failure mode: when a newer push's CI failed, or its image run built
      # nothing, this passing build exited 0 unpublished (and so did its
      # re-run), and the cluster silently stayed on the previous build.
      # Published only on the workflow_run path, and only once: a re-run that
      # finds the tag present does not re-push it, and any other answer from
      # the registry fails the job. The CI numbers are far above every tag
      # published under the old scheme, so the switch cannot go backwards.
      # Every other tag above behaves exactly as before.
      - name: Push Flux tag (main-<shortsha>-<run_number>)
        if: github.event_name == 'workflow_run' && env.IMAGE_RELEVANT == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          BRANCH: main
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail
          [[ "$RUN_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::bad run number '$RUN_NUMBER'"; exit 1; }
          tag="${BRANCH}-${SHORT_SHA}-${RUN_NUMBER}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          if out=$(docker manifest inspect "${IMAGE}:${tag}" 2>&1); then
            echo "::notice::${IMAGE}:${tag} already exists (re-run): not re-pushed"
            echo "Flux tag \`${tag}\` already present (re-run): not re-pushed." >> "$GITHUB_STEP_SUMMARY"
          elif grep -qiE 'manifest unknown|no such manifest' <<<"$out"; then
            docker tag obsidian-mcp:ci "${IMAGE}:${tag}"
            docker push "${IMAGE}:${tag}"
            echo "Flux tag \`${tag}\` published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::cannot tell whether ${IMAGE}:${tag} exists: ${out}"; exit 1
          fi
          docker logout ghcr.io
